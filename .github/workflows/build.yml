name: Build app

on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", ".github/workflows/ios.yml", "*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleRelease > gradle.log 2>&1; then
            MSG=$( (grep -E "error:|error -|FAILED|What went wrong|e: " gradle.log | sort -u | head -25; echo ----; grep -A8 "What went wrong" gradle.log | head -20) | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build log::$MSG"
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk EyeCompanion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EyeCompanion
          path: EyeCompanion.apk

      - name: Publish as a release (download this on the tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Eye Companion build ${{ github.run_number }}
          files: EyeCompanion.apk
          make_latest: true
