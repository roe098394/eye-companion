name: Build Co-Pilot (car AI)

on:
  push:
    paths: ["car/**", ".github/workflows/car.yml"]
  pull_request:
    paths: ["car/**", ".github/workflows/car.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FQBN: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=huge_app,CDCOnBoot=cdc
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the ESP32 core and ArduinoJson
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0
          arduino-cli lib install "ArduinoJson@7.4.2"
      - name: Compile
        run: |
          arduino-cli compile --fqbn "$FQBN" --warnings default --export-binaries car/CarCompanion
          ls -la car/CarCompanion/build/*/
          cp car/CarCompanion/build/*/CarCompanion.ino.merged.bin CoPilot.bin
      - uses: actions/upload-artifact@v4
        with:
          name: CoPilot-firmware
          path: CoPilot.bin
      - name: Publish as a release (flash this from a browser)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: copilot-${{ github.run_number }}
          name: Co-Pilot car AI build ${{ github.run_number }}
          files: CoPilot.bin
          make_latest: false
