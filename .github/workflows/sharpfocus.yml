name: Build Sharp Focus

on:
  push:
    branches: [main]
    paths: ["sharpfocus/**", ".github/workflows/sharpfocus.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sharpfocus
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
      - name: Build APK
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleRelease > gradle.log 2>&1; then
            MSG=$( (grep -E "error:|error -|FAILED|What went wrong|e: " gradle.log | sort -u | head -25; echo ----; grep -A8 "What went wrong" gradle.log | head -20) | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build log::$MSG"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../SharpFocus.apk
      - name: Publish as a release (download this on the projector)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sharpfocus-${{ github.run_number }}
          name: Sharp Focus build ${{ github.run_number }}
          files: SharpFocus.apk
          make_latest: false
