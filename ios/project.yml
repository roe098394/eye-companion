name: EyeCompanion
options:
  bundleIdPrefix: com.roe098394
  deploymentTarget:
    iOS: "17.0"
targets:
  EyeCompanion:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Eye Companion
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Pip listens through the phone's microphone so you can talk to it.
        NSSpeechRecognitionUsageDescription: Pip turns what you say into text on your phone, offline.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roe098394.eyecompanion
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
